# Você pode personalizar estas mensagens para o seu idioma e alterar as cores etc.
# Você pode desativar qualquer mensagem apagando tudo o que vem depois do sinal de igual (=)
# Exemplo: Newbie_Protection = (deixe este espaço vazio)
# Você também pode usar códigos de cor Hex, como &#FFFFFF, no Minecraft 1.16+
# Existem algumas variáveis que você pode usar neste arquivo em todas as mensagens,
# como {prefix}, e outras que só funcionam onde fazem sentido, como {player}, {time} e {money}
#
# Você pode começar qualquer mensagem com !actionbar ou !chat para controlar onde ela aparece
# - !actionbar = A mensagem aparece acima da barra rápida (recomendado para mensagens frequentes)
# - !chat = A mensagem aparece no chat (padrão quando não há prefixo)
# Exemplo: Item_Cooldown = !actionbar {prefix} &cVocê ainda não pode usar isto! Disponível em &e{time}

Prefix = &#992222&lPvP &#FF5555➤

# Alternância do PvP
PvP_Disabled = {prefix} &aPvP desativado! Você está protegido agora
PvP_Enabled = {prefix} &cPvP ativado! Agora você pode atacar e ser atacado
Attack_Denied_You = !actionbar {prefix} &#c9453eVocê está protegido contra PvP!
Attack_Denied_Other = !actionbar {prefix} &f{player} &#c9453eestá protegido contra PvP!
PvP_Force_Enabled_WorldGuard = {prefix} &6A proteção contra PvP foi desativada nesta região de PvP
PvP_Disabled_Fee = {prefix} &aVocê pagou uma taxa de &#FFD700{money} &apara ficar com o PvP desativado
PvP_Disabled_Fee_Not_Enough = {prefix} &6Proteção contra PvP desativada — saldo insuficiente para pagar a taxa

# Marcação de combate
Tagged_Attacker = {prefix} &7Você entrou em combate com &f{player}&7! Não saia do servidor!
Tagged_Defender = {prefix} &7Você entrou em combate com &f{player}&7! Não saia do servidor!
Out_Of_Combat = {prefix} &aVocê não está mais em combate
Out_Of_Combat_ActionBar = &aVocê não está mais em combate
Duel_Mode_Protection = !actionbar {prefix} &#c9453eEsse jogador está lutando contra outra pessoa!
Command_Denied_InCombat = {prefix} &cComando negado! Você ainda está em combate!
Block_Place_Blocked_InCombat = !actionbar {prefix} &cVocê não pode colocar blocos durante o combate!
Block_Break_Blocked_InCombat = !actionbar {prefix} &cVocê não pode quebrar blocos durante o combate!
Eating_Blocked_InCombat = !actionbar {prefix} &cVocê não pode comer durante o combate!
Elytra_Blocked_InCombat = !actionbar {prefix} &cVocê não pode usar élitros durante o combate!
Firework_Blocked_InCombat = !actionbar {prefix} &cVocê não pode usar fogos de artifício enquanto plana durante o combate!
Firework_Power_Limited_InCombat = !actionbar {prefix} &cVocê não pode usar fogos de artifício com potência &f{power} &cdurante o combate!
EnderPearl_Blocked_InCombat = {prefix} &cVocê não pode usar pérolas do End durante o combate!
ChorusFruit_Blocked_InCombat = {prefix} &cVocê não pode comer frutas do coro durante o combate!
Interact_Blocked_InCombat = !actionbar {prefix} &cVocê não pode clicar com o botão direito durante o combate!
Teleport_Blocked_InCombat = {prefix} &cVocê não pode se teleportar durante o combate!
Totem_Blocked_InCombat = {prefix} &cTotens da imortalidade não podem ser usados durante o combate!
Inventory_Blocked_InCombat = !actionbar {prefix} &cVocê não pode abrir o inventário durante o combate!
Pushback_Warning = {prefix} &#c9453eVocê não pode fugir para zonas seguras durante o combate!

# Proteção de novato
Newbie_Protection = {prefix} &aBem-vindo! Você está protegido contra PvP por &e{time}
Newbie_Protection_End = {prefix} &6Sua proteção contra PvP acabou! Agora você pode ser atacado!
Newbie_Protection_Removed = {prefix} &aVocê removeu sua proteção contra PvP! Tome cuidado
Newbie_Protection_On_Hit = {prefix} &#c9453eVocê está protegido contra PvP! Se realmente quiser lutar, remova a proteção com &f/newbie disable
Newbie_Protection_Attacker = !actionbar {prefix} &f{player} &#c9453eestá com proteção de novato!
Newbie_Time_Check = {prefix} &7Você está protegido contra PvP por &e{time}
Newbie_Time_Check_Other = {prefix} &f{player} &7está protegido contra PvP por mais &e{time}
Newbie_Command_Blocked = {prefix} &cVocê não pode usar este comando enquanto estiver com proteção de novato!
Newbie_Pickup_Items_Blocked = !actionbar {prefix} &cVocê não pode pegar itens enquanto estiver com proteção de novato!
Newbie_Force_Removed_WorldGuard = {prefix} &6Sua proteção de novato foi removida porque você entrou em uma região de PvP

# Proteção ao renascer
Respawn_Protection = !actionbar {prefix} &#c9453eVocê está protegido após renascer!
Respawn_Protection_Other = !actionbar {prefix} &f{player} &#c9453eestá protegido após renascer!

# Proteção do mundo
World_Protection = !actionbar {prefix} &#c9453eO PvP está desativado neste mundo!

# Proteção contra jogadores AFK
AFK_Protection = !actionbar {prefix} &#c9453eEste jogador não pode ser atacado enquanto estiver AFK

# Proteção global
Global_Protection = !actionbar {prefix} &#c9453eO combate PvP está desativado globalmente

# Abates de jogadores
Money_Reward = {prefix} &aVocê recebeu &#FFD700{money} &amoedas por matar o jogador &f{victim}&a!
Money_Penalty = {prefix} &cVocê perdeu &#FFD700{money} &cmoedas por morrer!
Money_Steal = {prefix} &f{player} &croubou &#FFD700{money} &cmoedas de você!
Exp_Won = {prefix} &aVocê recebeu &e{exp} &ade experiência por matar &f{victim}&a!
Exp_Stolen = {prefix} &f{player} &6roubou &e{exp} &6de experiência de você!

# Abuso de abates
Kill_Abuse_Warning = {prefix} &cVocê será punido se matar este jogador novamente! Pare, por favor.

# Tempo de recarga de itens
Item_Cooldown = !actionbar {prefix} &cVocê ainda não pode usar isto! Disponível em &e{time}

# Comandos
Error_Permission = &cVocê não tem permissão!
Error_Player_Not_Found = &cJogador não encontrado: &f{player}
Error_Not_Player = &cEste comando só pode ser usado por jogadores
# Comando de novato
Error_Not_Newbie = {prefix} &cVocê não é um novato!
# Comando de PvP
Error_PvP_Cooldown = {prefix} &cVocê ainda não pode alternar o PvP! Aguarde &e{time}
Error_PvPToggle_NoPvP = {prefix} &cVocê não pode ativar o PvP
Error_PvPToggle_ForcePvP = {prefix} &cVocê não pode desativar o PvP
PvPToggle_Admin_Changed = {prefix} &aO estado do PvP de &f{player} &afoi alterado para &f{state}
PvPToggle_Already_Disabled = {prefix} &cSeu PvP já está desativado!
PvPToggle_Already_Enabled = {prefix} &cSeu PvP já está ativado!
