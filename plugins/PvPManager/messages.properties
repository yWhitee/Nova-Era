PvPInfo_Enemies = &8├ &7Inimigos: &f
PvPInfo_Exemptions = &8└ &7Isenções: &f
PvPInfo_Footer = &#FFD700▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬▬
# Comando de lista de PvP
PvPList_Title = &#FFD700&l---- Jogadores com PvP ----
PvPList_Enabled = &a&lAtivado
PvPList_Disabled = &c&lDesativado
PvPList_Nothing_Found = &8Nenhum jogador encontrado
# Comando de status do PvP
Other_Status_Enabled = {prefix} &7O jogador &f{player} &7está com o PvP ativado
Others_Status_Disabled = {prefix} &7O jogador &f{player} &7está com o PvP desativado
Self_Status_Disabled = {prefix} &7Seu PvP está desativado
