PvPInfo_Header = &#FFD700▬▬▬▬▬ Informações do jogador: #f09a11{player} &#FFD700▬▬▬▬▬
PvPInfo_UUID = &8├ &7UUID: &f
PvPInfo_Combat = &8├ &7Combate: &f
PvPInfo_Protection = &8├ &7Proteção: &f
